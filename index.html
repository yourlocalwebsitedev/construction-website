    <style>
      /* Utility to hide scrollbars but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

      /* Hero background animation — subtle moving gradient + light sweep.
         Pure CSS, no image/video download, GPU-composited. */
      @keyframes heroGradientDrift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes heroLightSweep {
        0%   { transform: translateX(-30%) translateY(-10%) rotate(8deg); opacity: 0; }
        15%  { opacity: 0.35; }
        50%  { transform: translateX(10%) translateY(5%) rotate(8deg); opacity: 0.5; }
        85%  { opacity: 0.2; }
        100% { transform: translateX(60%) translateY(-10%) rotate(8deg); opacity: 0; }
      }
      .hero-animated-bg {
        background: linear-gradient(120deg, #0a0b0a 0%, #1c1a15 30%, #2e2617 50%, #14120e 70%, #0a0b0a 100%);
        background-size: 300% 300%;
        animation: heroGradientDrift 5s ease-in-out infinite;
      }
      .hero-light-sweep {
        background: linear-gradient(100deg, transparent 35%, rgba(184,134,43,0.4) 50%, transparent 65%);
        mix-blend-mode: screen;
        animation: heroLightSweep 5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-animated-bg, .hero-light-sweep { animation: none; }
      }
    </style>
